# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: zvfigoodswind
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: ERP-S1D
          url: http://sap1dweb.corp.vattenfall.com:443
          client: '100'
        app:
          name: ZVFI_E_LO_W_GR
          description: Goods receipt Wind
          package: ZVFI_WIND_FIORI_GOODS_RECEIPT
          transport: S1DK904654
        exclude:
          - /test/
